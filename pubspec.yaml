name: barber_app
description: A modern barbershop registration and booking app with smooth animations.
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  shimmer: ^3.0.0
  cached_network_image: ^3.3.0
  web: ^1.1.0
  http: ^1.2.0
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  proj4dart: ^3.0.0
  geolocator: ^13.0.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  supabase_flutter: ^2.8.0
  # One-tap Google sign-in. Pinned to 6.x: it exposes the native idToken +
  # accessToken pair that supabase.auth.signInWithIdToken() expects, which is
  # the flow Supabase documents. See lib/core/supabase/google_auth.dart.
  google_sign_in: ^6.2.2
  # SHA-256 for the Telegram login device-binding secret (already resolved
  # transitively via supabase_flutter; promoted to a direct dep to import it).
  crypto: ^3.0.3
  # Sign in with Apple. NOT optional: App Store Review Guideline 4.8 requires it
  # wherever a third-party sign-in (Google here) is offered, so an iOS build
  # without it is rejected. Android and web are unaffected — the button hides
  # itself off-Apple (see AppleAuth.available).
  sign_in_with_apple: ^6.1.3
  qr_flutter: ^4.1.0
  flutter_local_notifications: ^18.0.1
  mobile_scanner: ^5.2.3
  # Used at runtime to downscale AI-studio selfies before upload (and by tools).
  image: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/tiles/
    - assets/legal/
    # Demo try-on faces. Only files directly in this folder are bundled, so the
    # full-size originals kept in assets/faces/src/ stay out of the APK.
    - assets/faces/

flutter_launcher_icons:
  android: "ic_launcher"
  image_path: "assets/icon/icon_full.png"
  # Adaptive icon = white field + blue scissors, masked to any launcher shape.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/icon_full.png"
    background_color: "#16294B"
    theme_color: "#2E8BFF"
