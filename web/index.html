<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!--
    Content-Security-Policy: locks the app down to its own origin plus the
    Google Fonts + CanvasKit CDNs that Flutter web needs. 'wasm-unsafe-eval'
    is required by the CanvasKit renderer; no 'unsafe-inline' scripts are
    allowed (the splash script lives in flutter_first_frame.js).
    NOTE: frame-ancestors / X-Content-Type-Options / HSTS should also be set
    as real HTTP headers at the hosting layer for full protection.
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'wasm-unsafe-eval' https://www.gstatic.com;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com data:;
    img-src 'self' data: blob: https://*.maps.yandex.net https://*.basemaps.cartocdn.com https://*.tile.openstreetmap.org;
    media-src 'self' blob: mediastream:;
    connect-src 'self' data: https://vlpfxcvoqucthtnueaoh.supabase.co wss://vlpfxcvoqucthtnueaoh.supabase.co https://fonts.googleapis.com https://fonts.gstatic.com https://www.gstatic.com https://nominatim.openstreetmap.org https://*.maps.yandex.net https://*.basemaps.cartocdn.com https://*.tile.openstreetmap.org https://generativelanguage.googleapis.com https://*.workers.dev;
    worker-src 'self' blob:;
    object-src 'none';
    base-uri 'self';
    form-action 'self';
    frame-ancestors 'none';
  ">
  <meta name="referrer" content="no-referrer">

  <meta name="description" content="Fade — book your barber in seconds.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Fade">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2E8BFF">
  <title>Fade</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0B1422; }
    #loading {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #0B1422; color: #EEF3FB;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 30px; font-weight: 800; letter-spacing: 1.5px;
      transition: opacity .3s ease;
    }
    #loading::after { content: '...'; color: #2E8BFF; animation: dot 1.4s infinite steps(1); }
    @keyframes dot {
      0%, 20% { content: ''; }
      40% { content: '.'; }
      60% { content: '..'; }
      80%, 100% { content: '...'; }
    }
  </style>
</head>
<body>
  <div id="loading">FADE</div>
  <!-- Must load before the app boots: the passkeys web plugin (pulled in by
       supabase_flutter) looks for this global at startup. -->
  <script src="passkeys_stub.js"></script>
  <script src="flutter_bootstrap.js" async></script>
  <script src="flutter_first_frame.js"></script>
</body>
</html>
